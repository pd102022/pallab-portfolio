<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dr. Pallab Das | Professional Profile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #eef5fb;
            font-family: Arial, sans-serif;
            color: #17345f;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: min(92%, 430px);
            padding: 34px 24px;
            background: white;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 8px 28px rgba(23, 52, 95, 0.15);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 34px;
        }

        .designation {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .affiliation {
            font-size: 20px;
            color: #53677f;
            margin-bottom: 18px;
        }

        .contact-info {
            color: #53677f;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 24px;
        }

        .button {
            display: block;
            margin: 12px 0;
            padding: 16px;
            border-radius: 14px;
            background: #1f467f;
            color: white;
            text-decoration: none;
            font-size: 19px;
            font-weight: bold;
        }

        .button:hover {
            background: #2d65a5;
        }

        .footer {
            margin-top: 24px;
            color: #718096;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <main class="card">

        <h1>Dr. Pallab Das</h1>

        <div class="designation">
            Research Fellow
        </div>

        <div class="affiliation">
            Energy Research Institute @ NTU
        </div>

        <div class="contact-info">
            Phone: +65 9051 3432<br>
            NTU Email: pallab.das@ntu.edu.sg<br>
            Personal Email: pallab.cv13@gmail.com
        </div>

        <a class="button"
           href="https://www.linkedin.com/in/dr-pallab-das-72395a109/"
           target="_blank">
            LinkedIn
        </a>

        <a class="button"
           href="https://scholar.google.com/citations?user=78T-abAAAAAJ&hl=en"
           target="_blank">
            Google Scholar
        </a>

        <a class="button"
           href="https://orcid.org/0000-0003-4291-8365"
           target="_blank">
            ORCID
        </a>

        <div class="footer">
            Professional profile and contact information
        </div>

    </main>
</body>
</html>
